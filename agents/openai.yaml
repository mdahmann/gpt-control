interface:
  display_name: "GPT-Control"
  short_description: "GPT Chat, background GPT Workers, and Codex-controlled GPT Sub-agents"
  default_prompt: "Choose exactly one route. GPT Chat sends a direct message with gpt_chat. GPT Worker starts detached durable work with gpt_worker_start or gpt_worker_start_many, verifies callbackBound, and yields immediately. GPT Sub-agent starts a native Codex child in Goal Mode; it owns one GPT-Control conversation, accepts parent steering, and iterates until the goal is verified complete or blocked. Never call a GPT Worker a sub-agent."
policy:
  allow_implicit_invocation: true
